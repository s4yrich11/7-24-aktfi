<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Yönetim Paneli ve Canlı Loglar</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--success-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* CANLI LOG EKRANI STİLLERİ */
        .log-terminal {
            background-color: #050b14;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            height: 250px;
            overflow-y: auto;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column-reverse; /* Yeni loglar üste/alta akış */
            gap: 6px;
        }

        .log-line {
            color: #38bdf8;
            border-left: 3px solid var(--accent-color);
            padding-left: 8px;
            word-break: break-all;
        }

        .log-line:nth-child(even) {
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 Bot Yönetim Paneli</h1>

        <!-- Bot Durum Kartı -->
        <div class="card">
            <div class="card-title">Bot Durumu</div>
            <div class="status-badge">
                <div class="status-dot"></div> Çevrimiçi (Aktif)
            </div>
        </div>

        <!-- Durum Güncelleme Kartı -->
        <div class="card">
            <div class="card-title">Anlık Bot Durumunu (Oynuyor) Değiştir</div>
            <div class="input-group">
                <input type="text" id="oyunInput" placeholder="Örn: /premium | V8.18">
                <button onclick="durumuGuncelle()">Durumu Güncelle</button>
            </div>
            <p id="sonucMesaj" style="font-size: 0.85rem; margin-top: 8px; color: var(--text-muted);"></p>
        </div>

        <!-- CANLI AKAN LOG EKRANI -->
        <div class="card">
            <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
                <span>📡 Canlı Bot Logları (Terminal)</span>
                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal;">Otomatik güncelleniyor (2sn)</span>
            </div>
            <div class="log-terminal" id="logTerminal">
                <div class="log-line">Loglar yükleniyor...</div>
            </div>
        </div>
    </div>

    <script>
        // Bot Durumu Güncelleme Fonksiyonu
        async function durumuGuncelle() {
            const oyunAdi = document.getElementById('oyunInput').value;
            const mesajKutusu = document.getElementById('sonucMesaj');

            if (!oyunAdi) {
                mesajKutusu.style.color = '#f87171';
                mesajKutusu.innerText = 'Lütfen bir oyun adı girin!';
                return;
            }

            try {
                const response = await fetch('/api/durum-guncelle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oyun: oyunAdi })
                });
                const sonuc = await response.json();
                
                if (response.ok) {
                    mesajKutusu.style.color = 'var(--success-color)';
                    mesajKutusu.innerText = sonuc.mesaj;
                } else {
                    mesajKutusu.style.color = '#f87171';
                    mesajKutusu.innerText = sonuc.mesaj || 'Bir hata oluştu.';
                }
            } catch (err) {
                mesajKutusu.style.color = '#f87171';
                mesajKutusu.innerText = 'Sunucuya bağlanılamadı!';
            }
        }

        // CANLI LOGLARI SÜREKLİ ÇEKEN FONKSİYON (Her 2 saniyede bir)
        async function loglariGetir() {
            try {
                const response = await fetch('/api/loglar');
                const data = await response.json();
                const terminal = document.getElementById('logTerminal');
                
                if (data.loglar && data.loglar.length > 0) {
                    terminal.innerHTML = data.loglar.map(log => `<div class="log-line">[${new Date().toLocaleTimeString()}] ${log}</div>`).join('');
                }
            } catch (err) {
                console.error("Loglar alınamadı:", err);
            }
        }

        // Sayfa açıldığında başlat ve her 2 saniyede bir yenile
        setInterval(loglariGetir, 2000);
        loglariGetir();
    </script>
</body>
</html>
